[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-core"
version = "0.1.0"
description = "Personal AI Memory Core - model-agnostic, local-first long-term memory"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
memory = "memory_core.cli:main"

[tool.setuptools]
packages = [
    "memory_core",
    "memory_core.domain",
    "memory_core.storage",
    "memory_core.retrieval",
    "memory_core.formation",
    "memory_core.providers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
